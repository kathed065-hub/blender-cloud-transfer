name: Export Meshy Target
on:
  push:
    paths:
      - ".github/workflows/export-meshy-target.yml"
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: meshy-target
          path: meshy_head.glb
