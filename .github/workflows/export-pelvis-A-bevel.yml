name: Export pelvis A bevel
on:
  push:
    paths:
      - ".github/workflows/export-pelvis-A-bevel.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          python - <<'PY'
          import urllib.request
          b="https://blender-api-production.up.railway.app/models/8be67f4c0dd512a4132993698146a687/files/renders_v002/"
          for n in ["pelvis_segA_bevel_small_front.png","pelvis_segA_bevel_small_threequarter.png","pelvis_segA_bevel_medium_front.png","pelvis_segA_bevel_medium_threequarter.png"]:
              urllib.request.urlretrieve(b+n,n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pelvis-A-bevel
          path: "*.png"
