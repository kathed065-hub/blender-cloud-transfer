name: Export pelvis A dissolve5
on:
  push:
    paths:
      - ".github/workflows/export-pelvis-A-dissolve5.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import urllib.request
          b="https://blender-api-production.up.railway.app/models/8be67f4c0dd512a4132993698146a687/files/renders_v002/"
          for n in ["pelvis_segA_dissolve5_front.png","pelvis_segA_dissolve5_threequarter.png"]:
              urllib.request.urlretrieve(b+n,n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pelvis-A-dissolve5
          path: "*.png"
