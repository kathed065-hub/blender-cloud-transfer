name: Export pelvis bmesh v2 renders
on:
  push:
    paths:
      - ".github/workflows/export-pelvis-bmesh.yml"
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download renders
        run: |
          python - <<'PY'
          import urllib.request
          base="https://blender-api-production.up.railway.app/models/8be67f4c0dd512a4132993698146a687/files/renders_v002/"
          names=[
            "pelvis_bmesh_v2_before_front.png",
            "pelvis_bmesh_v2_before_threequarter.png",
            "pelvis_bmesh_v2_after_front.png",
            "pelvis_bmesh_v2_after_threequarter.png",
          ]
          for n in names:
              urllib.request.urlretrieve(base+n,n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pelvis-bmesh-v2-renders
          path: |
            pelvis_bmesh_v2_before_front.png
            pelvis_bmesh_v2_before_threequarter.png
            pelvis_bmesh_v2_after_front.png
            pelvis_bmesh_v2_after_threequarter.png
