name: Export pelvis segment A
on:
  push:
    paths:
      - ".github/workflows/export-pelvis-bmesh.yml"
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download renders
        run: |
          python - <<'PY'
          import urllib.request
          base="https://blender-api-production.up.railway.app/models/8be67f4c0dd512a4132993698146a687/files/renders_v002/"
          for n in ["pelvis_segment_A_v1_front.png","pelvis_segment_A_v1_threequarter.png"]:
              urllib.request.urlretrieve(base+n,n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pelvis-segment-A
          path: |
            pelvis_segment_A_v1_front.png
            pelvis_segment_A_v1_threequarter.png
